<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - artebalao</title>
    <link rel="icon" type="image/x-icon" href="logo.ico">
    <link rel="stylesheet" href="style.css?v=7">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-brand">ÁREA ADMINISTRATIVA</div>
            <div class="admin-logo">
                <img src="logo.png" alt="Logo" style="width: 30px; filter: brightness(0) invert(1);">
                <span>artebalao</span>
            </div>
            
            <ul class="admin-menu">
                <li><a href="admin.html" style="color: inherit; text-decoration: none;"><i class="fa-solid fa-house"></i> Visão geral</a></li>
                <li class="active"><i class="fa-solid fa-box-open"></i> Pedidos</li>
                <li><a href="admin-modelos.html" style="color: inherit; text-decoration: none;"><i class="fa-solid fa-box-open"></i> Modelos</a></li>
                <li onclick="sairDoAdmin()" class="btn-sair-admin">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                </li>
            </ul>
        </aside>

        <div class="mobile-menu-overlay" id="menu-overlay"></div>
    <nav class="mobile-menu" id="mobile-menu">
        <div class="menu-header">
            <span class="menu-title">Menu</span>
            <button class="close-menu" id="close-menu-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-links">
            <li><a href="index.html"><i class="fa-solid fa-house"></i> Início</a></li>
            <li><a href="eventos.html"><i class="fa-solid fa-star"></i> Eventos</a></li>
            <li><a href="modelos.html"><i class="fa-solid fa-shapes"></i> Catálogo</a></li>
            <li><a href="em-desenvolvimento.html"><i class="fa-solid fa-circle-info"></i> Sobre nós</a></li>
            <li><a href="em-desenvolvimento.html"><i class="fa-solid fa-envelope"></i> Contato</a></li>
            <li><a href="meus-pedidos.html" style="position: relative; display: inline-flex; align-items: center; gap: 8px;"><i class="fa-solid fa-cart-shopping"></i> Pedidos <span class="cart-count" style="position: relative; top: 0; right: 0; margin-left: 5px;">0</span></a></li>
            <li><a href="login.html"><i class="fa-solid fa-user"></i> Login / Registo</a></li>
        </ul>
    </nav>

    <main class="admin-main">
            <h1>Pedidos</h1>

            <div class="orders-container">
                <div class="orders-toolbar">
                    <div class="search-box admin-search">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" id="pesquisa-pedido" placeholder="Buscar pedido, cliente ou valor...">
                    </div>
                    <div class="filter-box admin-filter">
                        <select id="filtro-pedidos">
                            <option value="todos">Todos os status</option>
                            <option value="aguardando análise">Aguardando análise</option>
                            <option value="em produção">Em produção</option>
                            <option value="pronto para retirada">Pronto para retirada</option>
                            <option value="concluído">Concluído</option>
                        </select>
                    </div>
                </div>

                <div class="table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Pedido</th>
                        <th>Cliente</th>
                        <th>Retirada</th>
                        <th>Status</th>
                        <th>Valor Total</th>
                    </tr>
                </thead>
                <tbody id="tabela-pedidos-body">
                </tbody>
            </table>
        </div> </div> </main>
    <script src="script.js?v=7"></script>
</body>
</html>
